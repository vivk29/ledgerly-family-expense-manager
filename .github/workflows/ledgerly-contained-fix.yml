name: Ledgerly contained feature patch
on:
  push:
    branches: [reconstruct/auth-family-safe]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: implement household money and unified add' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ledgerly
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          marker='/* LEDGERLY_CONTAINED_FEATURES_V1 */'
          if marker in s:
              raise SystemExit('already patched')
          s=s.replace("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useRef, useState } from 'react';", 1)
          s=s.replace("[menu,setMenu]=useState(false);", "[menu,setMenu]=useState(false),[addMenuOpen,setAddMenuOpen]=useState(false);\n const transientRef=useRef({menu:false,add:false});\n useEffect(()=>{transientRef.current={menu,add:addMenuOpen}},[menu,addMenuOpen]);", 1)
          s=s.replace("split:'single',members:[] as string[],custom:{} as Record<string,string>,percent:{} as Record<string,string>,search:''", "split:'single',members:[] as string[],custom:{} as Record<string,string>,percent:{} as Record<string,string>,search:'',fundingSource:'member' as 'member'|'household'", 1)
          s=s.replace("const [income,setIncome]=useState({description:'Salary',amount:'',date:today(),member:'',category:''});", "const [income,setIncome]=useState({description:'Salary',amount:'',date:today(),member:'household',category:''});", 1)
          anchor="useEffect(()=>{const saved=typeof window!=='undefined'?localStorage.getItem('ledgerly_theme'):null;"
          effect="useEffect(()=>{const onPointer=(e:any)=>{const el=e.target as HTMLElement;if(!el.closest('.menu,.addMenu,.dots,.addFab')){setMenu(false);setAddMenuOpen(false)}};const onKey=(e:KeyboardEvent)=>{if(e.key==='Escape'){setMenu(false);setAddMenuOpen(false)}};const onPop=()=>{if(transientRef.current.menu||transientRef.current.add){setMenu(false);setAddMenuOpen(false);window.history.pushState({ledgerlyTransient:true},'',window.location.href)}};document.addEventListener('pointerdown',onPointer);document.addEventListener('keydown',onKey);window.addEventListener('popstate',onPop);window.history.replaceState({ledgerly:true},'',window.location.href);return()=>{document.removeEventListener('pointerdown',onPointer);document.removeEventListener('keydown',onKey);window.removeEventListener('popstate',onPop)}},[]);\n"
          assert anchor in s
          s=s.replace(anchor,effect+anchor,1)
          assert "expense_payers(member_id,amount),expense_allocations(member_id,amount,percentage),categories(name)" in s
          s=s.replace("expense_payers(member_id,amount),expense_allocations(member_id,amount,percentage),categories(name)", "expense_payers(member_id,amount),expense_allocations(member_id,amount,percentage),categories(name),funding_source", 1)
          s=s.replace("notes:expense.notes||null,split_mode:expense.split,updated_by:session.user.id,deleted_at:null", "notes:expense.notes||null,split_mode:expense.split,funding_source:expense.fundingSource,updated_by:session.user.id,deleted_at:null", 1)
          s=s.replace("notes:expense.notes||null,split_mode:expense.split,created_by:session.user.id", "notes:expense.notes||null,split_mode:expense.split,funding_source:expense.fundingSource,created_by:session.user.id", 1)
          s=s.replace("search:expense.search});setScreen('add')", "search:expense.search,fundingSource:e.funding_source||'member'});setScreen('add')", 1)
          old="const paid=liveExpenses.reduce((s:any,e:any)=>s+(e.expense_payers||[]).filter((p:any)=>p.member_id===m.id).reduce((a:any,p:any)=>a+Number(p.amount),0),0);"
          new="const paid=liveExpenses.reduce((s:any,e:any)=>s+(e.funding_source==='household'?0:(e.expense_payers||[]).filter((p:any)=>p.member_id===m.id).reduce((a:any,p:any)=>a+Number(p.amount),0)),0);"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("const total=monthExpenses.reduce((s:any,e:any)=>s+Number(e.amount),0),incomeTotal=incomes.filter", "const total=monthExpenses.reduce((s:any,e:any)=>s+Number(e.amount),0),householdExpenseTotal=monthExpenses.filter((e:any)=>e.funding_source==='household').reduce((s:any,e:any)=>s+Number(e.amount),0),incomeTotal=incomes.filter", 1)
          s=s.replace("reduce((s:any,e:any)=>s+Number(e.amount),0);const byCat", "reduce((s:any,e:any)=>s+Number(e.amount),0);const householdIncomeTotal=incomes.filter((i:any)=>String(i.income_date).slice(0,7)===monthKey&&i.member_id===null).reduce((s:any,e:any)=>s+Number(e.amount),0);const byCat", 1)
          s=s.replace("return{total,incomeTotal,savings:incomeTotal-total,byCat,byType,balances}", "return{total,incomeTotal,householdIncomeTotal,householdExpenseTotal,householdBalance:householdIncomeTotal-householdExpenseTotal,savings:incomeTotal-total,byCat,byType,balances}", 1)
          s=s.replace("setExpense(x=>({...x,description:'',amount:'',notes:'',split:'single',custom:{},percent:{}}))", "setExpense(x=>({...x,description:'',amount:'',notes:'',split:'single',custom:{},percent:{},fundingSource:'member'}))", 1)
          s=s.replace("setIncome(x=>({...x,amount:'',description:'Salary'}))", "setIncome(x=>({...x,amount:'',description:'Salary',member:'household'}))", 1)
          needle=" const calc=useMemo(()=>{"
          helper=" function openAdd(kind:'expense'|'income'){setMenu(false);setAddMenuOpen(false);setEditingId(null);if(kind==='income'){setScreen('income')}else{setExpense(x=>({...x,fundingSource:'member'}));setScreen('add')}}\n"
          assert needle in s
          s=s.replace(needle,helper+needle,1)
          home_add="<button className=\"addFab\" onClick={()=>{setEditingId(null);setScreen('add')}}>＋ Add</button>"
          assert home_add in s
          s=s.replace(home_add, "<div className=\"addMenuWrap\"><button className=\"addFab\" onClick={()=>setAddMenuOpen(!addMenuOpen)}>＋ Add</button>{addMenuOpen&&<div className=\"addMenu\"><button type=\"button\" onClick={()=>openAdd('expense')}><b>Expense</b><small>Record money spent</small></button><button type=\"button\" onClick={()=>openAdd('income')}><b>Income</b><small>Record personal or household income</small></button></div>}</div>", 1)
          nav_add="<button className={screen==='add'?'active addActive':''} onClick={()=>{setEditingId(null);setScreen('add')}}><span>＋</span>Add</button>"
          assert nav_add in s
          s=s.replace(nav_add, "<button className={screen==='add'||screen==='income'?'active addActive':''} onClick={()=>setAddMenuOpen(!addMenuOpen)}><span>＋</span>Add</button>", 1)
          amount_label="<label>Amount<input required type=\"number\" min=\"0.01\" step=\"0.01\" value={expense.amount} onChange={e=>setExpense({...expense,amount:e.target.value})}/></label>"
          assert amount_label in s
          source_label=amount_label+"<label>Paid from<select value={expense.fundingSource} onChange={e=>setExpense({...expense,fundingSource:e.target.value as 'member'|'household'})}><option value=\"member\">Member's money</option><option value=\"household\">Household / Home money</option></select></label>"
          s=s.replace(amount_label,source_label,1)
          assert "<label>Payer<select" in s
          s=s.replace("<label>Payer<select", "<label>{expense.fundingSource==='household'?'Recorded payer':'Payer'}<select", 1)
          old_income="<label>Member<select value={income.member} onChange={e=>setIncome({...income,member:e.target.value})}>{members.filter((m:any)=>m.is_active).map((m:any)=><option key={m.id} value={m.id}>{m.name}</option>)}</select></label>"
          new_income="<label>Income source<select value={income.member} onChange={e=>setIncome({...income,member:e.target.value})}><option value=\"household\">Household / Home income</option>{members.filter((m:any)=>m.is_active).map((m:any)=><option key={m.id} value={m.id}>{m.name}</option>)}</select></label>"
          assert old_income in s
          s=s.replace(old_income,new_income,1)
          s=s.replace("member_id:income.member||null", "member_id:income.member==='household'?null:(income.member||null)", 1)
          # Put the household pool card directly after the home dashboard's two-column cards.
          home_end="</div></div></>}\n {screen==='add'"
          assert home_end in s
          s=s.replace(home_end, "</div><div className=\"card householdPoolCard\"><div className=\"cardHead\"><h3>Household money</h3><span className=\"eyebrow\">This month</span></div><div className=\"householdPoolAmount\">{money(calc.householdBalance)}</div><p>Home income {money(calc.householdIncomeTotal)} · Home-funded expenses {money(calc.householdExpenseTotal)}</p></div></div></>}\n {screen==='add'", 1)
          p.write_text(s)
          css=Path('app/globals.css')
          c=css.read_text()
          if '.addMenuWrap' not in c:
              c += "\n.addMenuWrap{position:relative}.addMenu{position:absolute;right:0;top:calc(100% + 8px);width:230px;background:var(--surface-elevated,var(--surface));border:1px solid var(--border-strong);border-radius:16px;box-shadow:0 18px 45px var(--shadow);padding:7px;z-index:45}.addMenu button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:11px;color:var(--text)}.addMenu button:hover{background:var(--hover)}.addMenu b,.addMenu small{display:block}.addMenu small{margin-top:3px;color:var(--muted);font-size:11px}.householdPoolCard{margin-top:14px}.householdPoolAmount{font-size:30px;font-weight:900;margin:8px 0}.householdPoolCard p{margin:0;color:var(--muted);font-size:12px}\n"
              css.write_text(c)
          s += "\n"+marker+"\n"
          p.write_text(s)
      - name: Typecheck and build
        run: |
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          git commit -m 'feat: implement household money and unified add'
          git push
