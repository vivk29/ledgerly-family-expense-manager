name: Ledgerly source autofix

on:
  push:
    branches:
      - ledgerly-expanded-release

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[autofix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix strict TypeScript callback typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "(e.expense_allocations||[]).map(a=>a.member_id)"
          new = "(e.expense_allocations||[]).map((a:{member_id:string})=>a.member_id)"
          if old not in s:
              raise SystemExit('expected source pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m "fix: type expense allocation callback [autofix]"
          git push
