name: Ledgerly CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ledgerly-expanded-release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy isolated Vercel validation
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN GitHub Actions secret is not configured"; exit 1; fi
          npx --yes vercel@latest --yes --token "$VERCEL_TOKEN" --scope viveksrinivas142004-6961s-projects --name ledgerly-expanded-validation
