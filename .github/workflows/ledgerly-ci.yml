name: Ledgerly CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ledgerly-expanded-release
      - 'release-hardening/**'
      - 'ci/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Financial unit tests
        run: npm test
      - name: Production build
        run: npm run build
