name: Ledgerly CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ledgerly-expanded-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply verified strict TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "(e.expense_allocations||[]).map(a=>a.member_id)"
          new = "(e.expense_allocations||[]).map((a:{member_id:string})=>a.member_id)"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: npm run build
      - name: Persist source fix
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: type expense allocation callback [autofix]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
