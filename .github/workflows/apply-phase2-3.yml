name: Apply Ledgerly Phase 2 and 3

on:
  push:
    branches:
      - ledgerly-phase2-3-cleanup

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ledgerly-phase2-3-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply Phase 2/3 patch
        run: python3 scripts/phase2_3_apply.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'ledgerly-phase2-3-bot'
          git config user.email 'ledgerly-phase2-3-bot@users.noreply.github.com'
          git add app lib .env.example
          git commit -m 'fix: add receipt viewing, dark mode, and app cleanup'
          git push origin ledgerly-phase2-3-cleanup
