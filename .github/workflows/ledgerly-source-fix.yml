name: Ledgerly source fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply financial and member fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()
          helper="""function minimizeTransfers(balances:any[]){const debtors=balances.filter((x:any)=>x.is_active&&x.net<-.01).map((x:any)=>({id:x.id,name:x.name,amount:-x.net}));const creditors=balances.filter((x:any)=>x.is_active&&x.net>.01).map((x:any)=>({id:x.id,name:x.name,amount:x.net}));const out:any[]=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){const d=debtors[i],c=creditors[j],amount=Math.round(Math.min(d.amount,c.amount)*100)/100;if(amount>.01)out.push({fromId:d.id,toId:c.id,fromName:d.name,toName:c.name,amount});d.amount=Math.round((d.amount-amount)*100)/100;c.amount=Math.round((c.amount-amount)*100)/100;if(d.amount<=.01)i++;if(c.amount<=.01)j++;}return out;}\n\n"""
          if 'function minimizeTransfers(' not in s:
              s=s.replace("export default function Home(){",helper+"export default function Home(){",1)
          s=s.replace(",[categoryName,setCategoryName]=useState('');", ",[memberForm,setMemberForm]=useState({name:'',email:''}),[categoryName,setCategoryName]=useState('');",1)
          member_funcs=""" async function addMember(e:any){e.preventDefault();if(!family||!memberForm.name.trim())return;const r=await supabase.from('family_members').insert({family_id:family.id,name:memberForm.name.trim(),email:memberForm.email.trim()||null,income_monthly:0,budget_monthly:0,is_active:true});setMsg(r.error?.message||'Member added.');if(!r.error){setMemberForm({name:'',email:''});await loadFamily(family.id)}}\n async function editMember(id:string,name:string,email:string){const nextName=window.prompt('Member name',name);if(nextName===null||!nextName.trim())return;const nextEmail=window.prompt('Member email (optional)',email||'');const r=await supabase.from('family_members').update({name:nextName.trim(),email:nextEmail?.trim()||null}).eq('id',id);setMsg(r.error?.message||'Member updated.');if(!r.error)loadFamily(family.id)}\n"""
          if 'async function addMember(' not in s:
              s=s.replace("\n const calc=useMemo", "\n"+member_funcs+" const calc=useMemo",1)
          old_calc="const total=liveExpenses.reduce((s:any,e:any)=>s+Number(e.amount),0),incomeTotal=incomes.reduce((s:any,e:any)=>s+Number(e.amount),0);const byCat:any={},byType:any={};liveExpenses.forEach((e:any)=>"
          new_calc="const monthKey=new Date().toISOString().slice(0,7),monthExpenses=liveExpenses.filter((e:any)=>String(e.expense_date).slice(0,7)===monthKey);const total=monthExpenses.reduce((s:any,e:any)=>s+Number(e.amount),0),incomeTotal=incomes.filter((i:any)=>String(i.income_date).slice(0,7)===monthKey).reduce((s:any,e:any)=>s+Number(e.amount),0);const byCat:any={},byType:any={};monthExpenses.forEach((e:any)=>"
          if old_calc in s:s=s.replace(old_calc,new_calc,1)
          s=s.replace(";const monthLabel=new Date().toLocaleString('en-IN',{month:'long',year:'numeric'});", ";const settlementSuggestions=minimizeTransfers(calc.balances);const monthLabel=new Date().toLocaleString('en-IN',{month:'long',year:'numeric'});",1)
          settlement=""" {screen==='settlements'&&<div className=\"card pageCard\"><div className=\"pageTitle\"><div><span className=\"eyebrow\">Settle up</span><h1>Who owes whom</h1></div></div>{settlementSuggestions.length?<div className=\"settleList\">{settlementSuggestions.map((s:any)=><div className=\"settleCard\" key={`${s.fromId}-${s.toId}`}><div><b>{s.fromName}</b><span>owes</span><b>{s.toName}</b></div><strong>{money(s.amount)}</strong><button className=\"btn\" onClick={()=>{const v=window.prompt(`Payment amount (max ${s.amount.toFixed(2)})`,s.amount.toFixed(2));const n=Number(v);if(n>0&&n<=s.amount)settle(s.fromId,s.toId,n,s.amount);}}>Record payment</button></div>)}</div>:<div className=\"successBox\">Everyone is settled up 🎉</div>}<div className=\"listTitle\">Settlement history</div>{settlements.map((s:any)=><div className=\"expenseRow\" key={s.id}><div className=\"categoryIcon green\">{s.status==='reversed'?'↶':'✓'}</div><div className=\"grow\"><b>{members.find((m:any)=>m.id===s.from_member_id)?.name} → {members.find((m:any)=>m.id===s.to_member_id)?.name}</b><small>{s.status} · Paid {money(Number(s.paid_amount||0))} of {money(Number(s.amount))} · {new Date(s.created_at).toLocaleDateString('en-IN')}</small></div>{s.status!=='reversed'&&<button className=\"btn\" onClick={()=>reverseSettlement(s.id)}>Reverse</button>}</div>)}</div>}\n"""
          pattern=r"\n \{screen==='settlements'&&.*?\n \{screen==='tools'&&"
          s2=re.sub(pattern,"\n"+settlement+" {screen==='tools'&&",s,count=1,flags=re.S)
          if s2==s: raise SystemExit('settlement block not found')
          s=s2
          marker="<form className=\"inlineForm\" onSubmit={addCategory}>"
          member_form="<form className=\"inlineForm\" onSubmit={addMember}><input required value={memberForm.name} onChange={e=>setMemberForm({...memberForm,name:e.target.value})} placeholder=\"Member name\"/><input type=\"email\" value={memberForm.email} onChange={e=>setMemberForm({...memberForm,email:e.target.value})} placeholder=\"Email (optional)\"/><button className=\"btn primary\">Add member</button></form>"
          if member_form not in s:
              s=s.replace(marker,member_form+marker,1)
          s=s.replace("<span className=\"status\">{m.is_active?'Active':'Archived'}</span><button className=\"btn\" onClick={()=>toggleMember(m.id,!m.is_active)}>","<span className=\"status\">{m.is_active?'Active':'Archived'}</span>{m.is_active&&<button className=\"btn\" onClick={()=>editMember(m.id,m.name,m.email||'')}>Edit</button>}<button className=\"btn\" onClick={()=>toggleMember(m.id,!m.is_active)}>",1)
          p.write_text(s)
          PY
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete settlement algorithm and member management [autofix]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
