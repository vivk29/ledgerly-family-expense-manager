name: Ledgerly PR source autofix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.pull_request.head.sha, '')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Apply strict TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "(e.expense_allocations||[]).map(a=>a.member_id)"
          new = "(e.expense_allocations||[]).map((a:{member_id:string})=>a.member_id)"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('source already fixed')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: type expense allocation callback [autofix]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
